f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Verifica del codice...';try{if(!crypto?.subtle)throw Error('Apri la pagina tramite HTTPS in Safari.');const pw=document.querySelector('#secret').value;const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode64(SALT_B64),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(IV_B64)},key,decode64(CT_B64));const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close();}catch(err){msg.textContent=err.message.includes('HTTPS')?err.message:'Codice errato. Riprova.';btn.disabled=false;}});
